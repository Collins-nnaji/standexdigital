<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Architecture diagram: Salesforce clouds connected through an integration layer to Power BI, Microsoft Fabric, Teams, ERP and finance systems">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>

  <!-- column labels -->
  <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#64748b">
    <text x="60" y="56">SALESFORCE</text>
    <text x="470" y="56">INTEGRATION LAYER</text>
    <text x="860" y="56">INSIGHT &amp; OPERATIONS</text>
  </g>

  <!-- left: clouds -->
  <g filter="url(#s)" font-size="16" font-weight="700" fill="#0f172a">
    <rect x="60" y="80" width="300" height="78" rx="16" fill="#fff" stroke="#bae6fd"/>
    <rect x="60" y="174" width="300" height="78" rx="16" fill="#fff" stroke="#bae6fd"/>
    <rect x="60" y="268" width="300" height="78" rx="16" fill="#fff" stroke="#bae6fd"/>
    <rect x="60" y="362" width="300" height="78" rx="16" fill="#fff" stroke="#bae6fd"/>
    <rect x="60" y="456" width="300" height="78" rx="16" fill="#fff" stroke="#bae6fd"/>
  </g>
  <g>
    <rect x="80" y="101" width="36" height="36" rx="9" fill="#0b78c9"/><rect x="80" y="195" width="36" height="36" rx="9" fill="#0b78c9"/><rect x="80" y="289" width="36" height="36" rx="9" fill="#0b78c9"/><rect x="80" y="383" width="36" height="36" rx="9" fill="#0b78c9"/><rect x="80" y="477" width="36" height="36" rx="9" fill="#0b78c9"/>
  </g>
  <path transform="translate(86 106)" d="M3 20h17a5.5 5.5 0 0 0 1-10.9A7.5 7.5 0 0 0 6.6 8 5.3 5.3 0 0 0 3 20Z" fill="#fff"/><path transform="translate(86 200)" d="M3 20h17a5.5 5.5 0 0 0 1-10.9A7.5 7.5 0 0 0 6.6 8 5.3 5.3 0 0 0 3 20Z" fill="#fff"/><path transform="translate(86 294)" d="M3 20h17a5.5 5.5 0 0 0 1-10.9A7.5 7.5 0 0 0 6.6 8 5.3 5.3 0 0 0 3 20Z" fill="#fff"/><path transform="translate(86 388)" d="M3 20h17a5.5 5.5 0 0 0 1-10.9A7.5 7.5 0 0 0 6.6 8 5.3 5.3 0 0 0 3 20Z" fill="#fff"/><path transform="translate(86 482)" d="M3 20h17a5.5 5.5 0 0 0 1-10.9A7.5 7.5 0 0 0 6.6 8 5.3 5.3 0 0 0 3 20Z" fill="#fff"/>
  <g font-size="16" font-weight="700" fill="#0f172a">
    <text x="130" y="116">Sales Cloud</text>
    <text x="130" y="210">Service Cloud</text>
    <text x="130" y="304">Marketing Cloud</text>
    <text x="130" y="398">Experience Cloud</text>
    <text x="130" y="492">Data Cloud &amp; Agentforce</text>
  </g>
  <g font-size="12" fill="#64748b">
    <text x="130" y="136">Leads, opportunities, forecasts</text>
    <text x="130" y="230">Cases, SLAs, knowledge</text>
    <text x="130" y="324">Campaigns, journeys, scoring</text>
    <text x="130" y="418">Customer &amp; partner portals</text>
    <text x="130" y="512">Unified profiles, AI agents</text>
  </g>

  <!-- middle: integration hub -->
  <g filter="url(#s)">
    <rect x="470" y="150" width="260" height="290" rx="22" fill="#0f172a"/>
  </g>
  <text x="600" y="196" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Integration &amp; data</text>
  <g font-size="13" font-weight="600">
    <rect x="496" y="218" width="208" height="40" rx="10" fill="#1e293b"/><text x="600" y="243" fill="#e2e8f0" text-anchor="middle">REST &amp; Bulk APIs</text>
    <rect x="496" y="268" width="208" height="40" rx="10" fill="#1e293b"/><text x="600" y="293" fill="#e2e8f0" text-anchor="middle">MuleSoft / Power Automate</text>
    <rect x="496" y="318" width="208" height="40" rx="10" fill="#1e293b"/><text x="600" y="343" fill="#e2e8f0" text-anchor="middle">Fabric pipelines</text>
    <rect x="496" y="368" width="208" height="40" rx="10" fill="#10b981"/><text x="600" y="393" fill="#fff" text-anchor="middle">Data quality &amp; governance</text>
  </g>

  <!-- right: destinations -->
  <g filter="url(#s)">
    <rect x="860" y="80" width="280" height="96" rx="16" fill="#fff" stroke="#fde68a"/>
    <rect x="860" y="196" width="280" height="96" rx="16" fill="#fff" stroke="#a7f3d0"/>
    <rect x="860" y="312" width="280" height="96" rx="16" fill="#fff" stroke="#c7d2fe"/>
    <rect x="860" y="428" width="280" height="96" rx="16" fill="#fff" stroke="#e2e8f0"/>
  </g>
  <rect x="880" y="104" width="10" height="48" rx="5" fill="#f59e0b"/>
  <rect x="880" y="220" width="10" height="48" rx="5" fill="#10b981"/>
  <rect x="880" y="336" width="10" height="48" rx="5" fill="#6366f1"/>
  <rect x="880" y="452" width="10" height="48" rx="5" fill="#64748b"/>
  <g font-size="16" font-weight="700" fill="#0f172a">
    <text x="906" y="122">Power BI dashboards</text>
    <text x="906" y="238">Microsoft Fabric</text>
    <text x="906" y="354">Teams, Outlook &amp; Copilot</text>
    <text x="906" y="470">ERP, finance &amp; billing</text>
  </g>
  <g font-size="12" fill="#64748b">
    <text x="906" y="144">Pipeline, revenue, service KPIs</text>
    <text x="906" y="260">OneLake history &amp; data agents</text>
    <text x="906" y="376">Notifications, approvals, agents</text>
    <text x="906" y="492">Orders, invoices, customer sync</text>
  </g>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M360 119 C420 119 420 230 466 230"/>
    <path d="M360 213 C420 213 420 260 466 260"/>
    <path d="M360 307 C420 307 420 295 466 295"/>
    <path d="M360 401 C420 401 420 330 466 330"/>
    <path d="M360 495 C420 495 420 370 466 370"/>
    <path d="M734 230 C800 230 800 128 856 128"/>
    <path d="M734 270 C800 270 800 244 856 244"/>
    <path d="M734 320 C800 320 800 360 856 360"/>
    <path d="M734 370 C800 370 800 476 856 476"/>
  </g>
</svg>
